name: Watcher

on:
  # PRIMARY — external cron (cron-job.org) POSTs
  # {"event_type": "crypto-watcher-tick"} to /repos/{owner}/{repo}/dispatches
  # at :17 past 00/04/08/12/16/20 UTC, same pattern as swing-manager.yml
  # and day-watcher.yml. Aligned with the strategy's 4H setup-confirmation
  # timeframe so each scan sees a freshly-closed 4H candle. Required
  # because the free-tier native scheduler is best-effort: on the native
  # schedule alone this workflow slid from 42 scans/week (Jul 2026) to
  # 17-22 (Nov 2026), with a median gap of 8.8h instead of 4h.
  repository_dispatch:
    types: [crypto-watcher-tick]
  # BACKUP — native schedule on the same slots, plus the old 14:00 UTC
  # (17:00 EAT) safety net. A backup tick scans only when the current
  # 4-hour slot has NOT already been covered (guard step below), so a
  # healthy external cron never produces duplicate scans, and a dead one
  # degrades to the old native cadence instead of to nothing.
  schedule:
    - cron: '17 */4 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      test_ping:
        description: 'Send a Telegram test ping instead of running the scan'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # fallback guard needs to query workflow runs

# One group across ALL workflows that touch the paper account + state
# repo (swing-manager.yml shares it): overlapping runs could each pass
# the max-positions gate before the other's fill lands, or race the
# journal push. A run in progress is never cancelled, but GitHub keeps
# only ONE waiting run per group: a newer tick (from either workflow)
# replaces the one already waiting. A scan lost that way is cancelled,
# not successful, so the backup tick's guard below still scans the slot,
# and the doctor reports the replaced run.
concurrency:
  group: alpaca-paper-trading-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram test ping
        if: github.event.inputs.test_ping == 'true'
        run: |
          python -c "import sys; from src.notifier import send_alert; sys.exit(0 if send_alert('🧪 GitHub Actions → Telegram pipeline test. (workflow_dispatch with test_ping=true.)') else 1)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Skip backup tick if this 4h slot is already covered
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Slots are HH:17 UTC for HH in 0,4,...,20. Epoch 0 is midnight
          # UTC, so 4-hour multiples of epoch seconds land on those hours.
          now=$(date -u +%s)
          slot=$(( (now - 1020) / 14400 * 14400 + 1020 ))
          # 2 min of slack: the dispatch run can be created a moment
          # before the slot boundary on clock skew.
          since=$(date -u -d "@$(( slot - 120 ))" +%Y-%m-%dT%H:%M:%SZ)
          # Covered = a dispatch run that succeeded or is still in flight
          # (the primary never skips), or a schedule run that succeeded.
          # In-flight schedule runs are not counted, so two backup ticks
          # can never each skip in favor of the other.
          #
          # "In flight" only counts for 30 minutes. GitHub sometimes
          # leaves a run "queued" forever (11 such runs Sep–Nov 2026);
          # a primary stuck like that never scans, and without the age
          # limit it would make every backup tick in the slot skip.
          # ISO-8601 UTC timestamps compare correctly as strings.
          fresh=$(date -u -d "@$(( now - 1800 ))" +%Y-%m-%dT%H:%M:%SZ)
          covered=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/watcher.yml/runs" \
            -f created=">=${since}" -f per_page=50 \
            --jq "[.workflow_runs[]
                   | select(.id != ${GITHUB_RUN_ID})
                   | select((.event == \"repository_dispatch\"
                             and (.conclusion == \"success\"
                                  or (.status != \"completed\"
                                      and .created_at > \"${fresh}\")))
                            or (.event == \"schedule\" and .conclusion == \"success\"))]
                  | length")
          echo "slot_start=$(date -u -d "@${slot}" +%Y-%m-%dT%H:%M:%SZ)"
          echo "runs_covering_slot=${covered}"
          if [ "${covered}" -gt 0 ]; then
            echo "Slot already covered — skipping backup tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Slot not covered — backup tick runs the scan."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone private state repository
        if: github.event.inputs.test_ping != 'true' && steps.guard.outputs.skip != 'true'
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          if [ -z "${STATE_REPO_TOKEN}" ]; then
            echo "STATE_REPO_TOKEN not set — journal unavailable; the"
            echo "watcher stays alerts-only for entries (fail closed)."
            exit 0
          fi
          git clone --depth 50 \
            "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/AI-Trading-State.git" \
            "${GITHUB_WORKSPACE}/state-repo"
          git -C "${GITHUB_WORKSPACE}/state-repo" config user.name "crypto-watcher[bot]"
          git -C "${GITHUB_WORKSPACE}/state-repo" config user.email "crypto-watcher@users.noreply.github.com"

      - name: Run watcher
        if: github.event.inputs.test_ping != 'true' && steps.guard.outputs.skip != 'true'
        run: python -m src.watcher
        env:
          STATE_REPO_DIR: ${{ github.workspace }}/state-repo
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_TRADE: ${{ secrets.ALPACA_PAPER_TRADE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 'fallback' = the native backup schedule had to do this scan
          # because the external cron missed the slot; it shows as
          # (FALLBACK) in the Telegram summary.
          WATCHER_RUN_KIND: ${{ github.event_name == 'schedule' && 'fallback' || 'primary' }}
          # Phase 5a kill switch: set this GitHub Secret to "true" to enable
          # auto-execution of qualifying setups. Anything else (unset, "false",
          # etc.) keeps the watcher in alerts-only mode. Auto-execute also
          # requires ALPACA_PAPER_TRADE=True — live trading is never automated.
          WATCHER_AUTO_EXECUTE: ${{ secrets.WATCHER_AUTO_EXECUTE }}
